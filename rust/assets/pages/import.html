<!doctype html>
<html><head><meta charset="utf-8"><title>Import</title>
<!--common-->
<style>
#list{margin-top:16px;display:grid;gap:12px}
.card{border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.head{display:flex;gap:8px;align-items:center}
.head b{flex:1}
.what{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 0}
.what label{display:flex;gap:6px;align-items:center}
.foot{display:flex;gap:8px;align-items:center}
.done{color:var(--dim);font-size:12px;flex:1}
.hint{color:var(--dim);font-size:12px;margin:10px 0 6px}
</style></head>
<body><main>
<h1 id="title"></h1>
<p class="detail" id="intro"></p>
<div id="list"></div>
<p class="empty" id="none" hidden></p>
</main>
<script>
const T = pt ? {
  title: 'Importar de outro navegador', intro: 'Nada é lido até você escolher. Importar de novo traz só o que é novo.',
  none: 'Nenhum outro navegador encontrado neste PC.', all: 'Todos os perfis', bookmarks: 'Favoritos', history: 'Histórico',
  tabs: 'Abas abertas', arc: 'Espaços e fixados do Arc', spaces_on: 'Ligar os Espaços', go: 'Importar', busy: 'Importando…',
  csv: 'Importar CSV…', last: 'Última vez', got: r => `${r.bookmarks} favorito(s), ${r.places} lugar(es), ${r.tabs} aba(s), ${r.spaces} espaço(s), ${r.pinned} fixado(s)`,
  kept: (k, s) => `${k} senha(s) importada(s)` + (s ? `, ${s} ignorada(s)` : ''),
} : {
  title: 'Import from another browser', intro: 'Nothing is read until you choose. Importing again brings only what is new.',
  none: 'No other browser found on this PC.', all: 'Every profile', bookmarks: 'Bookmarks', history: 'History',
  tabs: 'Open tabs', arc: 'Arc spaces and pins', spaces_on: 'Turn on Spaces', go: 'Import', busy: 'Importing…',
  csv: 'Import CSV…', last: 'Last time', got: r => `${r.bookmarks} bookmark(s), ${r.places} place(s), ${r.tabs} tab(s), ${r.spaces} space(s), ${r.pinned} pin(s)`,
  kept: (k, s) => `${k} password(s) imported` + (s ? `, ${s} skipped` : ''),
};
document.title = T.title;
$('title').textContent = T.title;
$('intro').textContent = T.intro;
$('none').textContent = T.none;

function box(text, on) {
  const input = make('input', {type: 'checkbox', checked: on});
  return [make('label', {}, [input, text]), input];
}

function card(b) {
  const profile = make('select', {}, [make('option', {value: '', textContent: T.all}),
    ...b.profiles.map(p => make('option', {value: p.id, textContent: p.name, selected: p.id === b.usual}))]);
  const [lb, bookmarks] = box(T.bookmarks, true), [lh, history] = box(T.history, true);
  const [lt, tabs] = box(T.tabs, false), [la, arc] = box(T.arc, b.arc), [ls, spaces_on] = box(T.spaces_on, false);
  const what = make('div', {className: 'what'}, [lb, lh]);
  if (!b.firefox) what.append(lt);
  if (b.arc) what.append(la, ls);
  const done = make('div', {className: 'done', textContent: b.record ? `${T.last}: ${new Date(b.record.date).toLocaleString()}` : ''});
  const go = make('button', {className: 'go', textContent: T.go});
  go.onclick = () => {
    go.disabled = true; done.textContent = T.busy;
    ask('import.run', {browser: b.name, profile: profile.value || null, bookmarks: bookmarks.checked, history: history.checked,
      tabs: tabs.checked, arc: arc.checked, spaces_on: spaces_on.checked})
      .then(r => { go.disabled = false; done.textContent = r.error || T.got(r); });
  };
  const csv = make('button', {textContent: T.csv, onclick: () => ask('passwords.import').then(r => { if (r.kept !== undefined || r.error) done.textContent = r.error || T.kept(r.kept, r.skipped); })});
  const c = make('div', {className: 'card'}, [
    make('div', {className: 'head'}, [make('b', {textContent: b.name}), ...(b.profiles.length > 1 ? [profile] : [])]),
    what, make('div', {className: 'foot'}, [done, go]),
    make('p', {className: 'hint', textContent: b.hint}), csv,
  ]);
  c.dataset.browser = b.name;
  return c;
}

ask('import.list').then(reply => {
  const browsers = reply.browsers || [];
  $('list').replaceChildren(...browsers.map(card));
  $('none').hidden = !!browsers.length;
});
</script>
</body></html>
