<!doctype html>
<html><head><meta charset="utf-8"><title>Bookmarks</title>
<!--common-->
<style>
.top{display:flex;gap:8px;align-items:center}
.top input{flex:1}
.row{padding:6px 8px 6px 14px}
.row:hover,.row:focus-within{background:var(--hover)}
.kids{margin-left:18px}
.folder>.grow{font-weight:600}
a{color:inherit;text-decoration:none;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grow>div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tool{border:0;background:none;color:var(--dim);height:28px;padding:0 6px;flex:none;opacity:0}
.row:hover .tool,.tool:focus-visible{opacity:1}
.edit{flex-wrap:wrap}
.edit input[type=text]{flex:1 1 200px;min-width:0}
#note{color:var(--dim);margin:8px 4px 0}
</style></head>
<body><main>
<h1 id="title"></h1>
<div class="top">
  <input type="search" id="find" autofocus autocomplete="off">
  <button id="folder"></button>
  <select id="import"></select>
</div>
<p id="note" hidden></p>
<div id="list"></div>
<p class="empty" id="none" hidden></p>
</main>
<script>
const T = pt ? {
  title: 'Favoritos', find: 'Buscar nos favoritos', empty: 'Nenhum favorito ainda — Ctrl+Shift+B guarda a página aberta',
  none: 'Nada encontrado', folder: 'Nova pasta', newFolder: 'Nova pasta', edit: 'Editar', remove: 'Remover',
  openAll: 'Abrir todos', save: 'Salvar', cancel: 'Cancelar', top: 'Fora de pastas', name: 'Nome', address: 'Endereço',
  importFrom: 'Importar…', chrome: 'Do Chrome', edge: 'Do Edge', notFound: 'Não achei favoritos desse navegador',
  unreadable: 'Esse arquivo de favoritos não pôde ser lido', imported: (a, b) => `${a} importados, ${b} já estavam aqui`,
  badAddress: 'Esse endereço não abre uma página',
} : {
  title: 'Bookmarks', find: 'Search bookmarks', empty: 'No bookmarks yet — Ctrl+Shift+B keeps the page you are on',
  none: 'No match', folder: 'New folder', newFolder: 'New folder', edit: 'Edit', remove: 'Remove',
  openAll: 'Open all', save: 'Save', cancel: 'Cancel', top: 'Not in a folder', name: 'Name', address: 'Address',
  importFrom: 'Import…', chrome: 'From Chrome', edge: 'From Edge', notFound: 'No bookmarks found for that browser',
  unreadable: "That bookmarks file couldn't be read", imported: (a, b) => `${a} imported, ${b} already here`,
  badAddress: "That address doesn't open a page",
};
const find = $("find"), list = $("list"), none = $("none"), note = $("note"), folderButton = $("folder"), importer = $("import");
document.title = T.title;
$("title").textContent = T.title;
find.placeholder = T.find;
folderButton.textContent = T.folder;
for (const [value, text] of [['', T.importFrom], ['chrome', T.chrome], ['edge', T.edge]]) importer.append(make('option', {value, textContent: text}));

let folders = [];
let editing = null;

function say(text) { note.textContent = text; note.hidden = !text; }

function tool(text, label, onclick) {
  const b = make('button', {className: 'tool', textContent: text, title: label, onclick});
  b.setAttribute('aria-label', label);
  return b;
}

// Titles come from the web: always text, never markup.
function siteRow(node, path) {
  if (editing === node.id) return editor(node);
  const link = make('a', {className: 'grow', title: node.url}, [
    make('div', {textContent: node.title || node.url}),
    make('div', {className: 'detail', textContent: path ? path + ' — ' + node.url : node.url}),
  ]);
  if (/^(https?|file):/i.test(node.url)) link.href = node.url;
  const r = make('div', {className: 'row site'}, [link,
    tool('✎', T.edit, () => { editing = node.id; load(); }),
    tool('×', T.remove, () => ask('bookmarks.remove', {node: node.id}).then(load))]);
  r.dataset.node = node.id;
  return r;
}

function folderRow(node, path) {
  if (editing === node.id) return editor(node);
  const r = make('div', {className: 'row folder'}, [
    make('div', {className: 'grow', textContent: path ? path + ' / ' + node.title : node.title}),
    tool('↗', T.openAll, () => ask('bookmarks.open', {node: node.id})),
    tool('✎', T.edit, () => { editing = node.id; load(); }),
    tool('×', T.remove, () => ask('bookmarks.remove', {node: node.id}).then(load))]);
  r.dataset.node = node.id;
  return r;
}

// Rename, a new address, and which folder it sits in, all in its own row.
function editor(node) {
  const isFolder = !node.url;
  const name = make('input', {type: 'text', className: 'name', value: node.title, placeholder: T.name});
  const address = make('input', {type: 'text', className: 'address', value: node.url || '', placeholder: T.address, hidden: isFolder});
  const where = make('select', {className: 'where'});
  where.append(make('option', {value: '', textContent: T.top}));
  for (const f of folders) {
    if (f.id === node.id) continue;
    where.append(make('option', {value: f.id, textContent: ' '.repeat(f.depth) + f.title}));
  }
  where.value = node.parent || '';
  const save = make('button', {className: 'save', textContent: T.save, onclick: async () => {
    if (name.value !== node.title) await ask('bookmarks.rename', {node: node.id, title: name.value});
    if (!isFolder && address.value !== node.url) {
      const reply = await ask('bookmarks.update', {node: node.id, url: address.value.trim()});
      if (!reply.ok) { say(T.badAddress); return; }
    }
    if (where.value !== (node.parent || '')) await ask('bookmarks.move', {node: node.id, folder: where.value || null});
    editing = null; say(''); load();
  }});
  const cancel = make('button', {className: 'cancel', textContent: T.cancel, onclick: () => { editing = null; load(); }});
  const r = make('div', {className: 'row edit'}, [name, address, where, save, cancel]);
  r.dataset.node = node.id;
  r.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') cancel.click(); });
  setTimeout(() => { r.scrollIntoView({block: 'nearest'}); name.focus(); name.select(); });
  return r;
}

function tree(nodes, parent, box) {
  for (const node of nodes) {
    node.parent = parent;
    if (node.url) { box.append(siteRow(node)); continue; }
    box.append(folderRow(node));
    const kids = make('div', {className: 'kids'});
    tree(node.children || [], node.id, kids);
    box.append(kids);
  }
}

function show(reply) {
  folders = reply.folders || [];
  if (reply.edit) { editing = reply.edit; find.value = ''; }
  list.replaceChildren();
  const box = make('div', {className: 'box'});
  if (reply.found) {
    for (const n of reply.found) box.append(n.folder ? folderRow(n, n.path.join(' / ')) : siteRow(n, n.path.join(' / ')));
  } else {
    tree(reply.tree || [], null, box);
  }
  if (box.children.length) list.append(box);
  none.textContent = find.value.trim() ? T.none : T.empty;
  none.hidden = !!box.children.length;
}

let typing = 0;
function load() { return ask('bookmarks.list', {query: find.value}).then(show); }
window.onAppEvent = e => { if (e.event === 'changed') load(); };
find.addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(load, 120); });
folderButton.onclick = () => ask('bookmarks.folder', {title: T.newFolder}).then(r => { editing = r.made; find.value = ''; load(); });
// Only now, because you asked, is the other browser's file read.
importer.onchange = () => {
  const from = importer.value;
  importer.value = '';
  if (!from) return;
  ask('bookmarks.import', {from}).then(r => {
    say(r.error === 'not found' ? T.notFound : r.error ? T.unreadable : T.imported(r.added, r.already));
    load();
  });
};
load();
</script>
</body></html>
