[package]
name = "searchwin-vault"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
url = { workspace = true }

# Credential Manager (Win32) and Windows Hello (WinRT UserConsentVerifier).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_WinRT",
]
