<!doctype html>
<html><head><meta charset="utf-8"><title>Passwords</title>
<!--common-->
<style>
.top{display:flex;gap:8px;align-items:center}
.top h1{margin:0;flex:1}
#find{margin-top:16px}
#list{margin-top:12px}
.row{flex-wrap:wrap}
.grow>div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.host{font-weight:600}
.secret{font-family:Consolas,monospace;user-select:all}
.edit{display:flex;gap:8px;width:100%}
.edit input{flex:1;min-width:0}
.act{flex:none}
.note{color:var(--dim);font-size:12px;margin:16px 4px 0}
#error{color:#c42b1c}
</style></head>
<body><main>
<div class="top"><h1 id="title"></h1><button id="import"></button><button id="export"></button></div>
<input type="search" id="find">
<p id="error" class="note" hidden></p>
<div id="list"></div>
<p class="empty" id="none" hidden></p>
<h2 id="never-title" hidden></h2>
<div id="never"></div>
<p class="note" id="keys"></p>
<p class="note" id="where"></p>
</main>
<script>
const T = pt ? {
  title: 'Senhas', find: 'Pesquisar senhas', empty: 'Nenhuma senha salva', import: 'Importar CSV…', export: 'Exportar…',
  show: 'Mostrar', hide: 'Ocultar', copy: 'Copiar', copied: 'Copiada — sai da área de transferência em 30 s', edit: 'Editar', save: 'Salvar', cancel: 'Cancelar',
  remove: 'Apagar', sure: n => `Apagar a senha de ${n}? Não dá para desfazer.`, user: 'Usuário', note: 'Nota', noname: '(sem nome)',
  never: 'Nunca perguntar nestes sites', forget: 'Remover', imported: (k, s) => `${k} importada(s)` + (s ? `, ${s} ignorada(s)` : ''),
  exported: n => `${n} senha(s) exportada(s). O arquivo tem as senhas às claras: não o abra numa planilha (Excel), e apague-o quando terminar.`,
  keys: 'Chaves de acesso (passkeys) são guardadas pelo Windows, não aqui: o Windows Hello as oferece quando um site pede.',
  where: 'As senhas ficam no Gerenciador de Credenciais do Windows, protegidas pela sua conta do Windows (como no Chrome e no Edge): outros usuários do PC não as leem, mas programas rodando na sua conta podem. Mostrar, copiar e exportar pedem o Windows Hello.',
} : {
  title: 'Passwords', find: 'Search passwords', empty: 'No passwords saved', import: 'Import CSV…', export: 'Export…',
  show: 'Show', hide: 'Hide', copy: 'Copy', copied: 'Copied — it leaves the clipboard in 30 s', edit: 'Edit', save: 'Save', cancel: 'Cancel',
  remove: 'Delete', sure: n => `Delete the password for ${n}? This can't be undone.`, user: 'User name', note: 'Note', noname: '(no name)',
  never: 'Never asked on these sites', forget: 'Remove', imported: (k, s) => `${k} imported` + (s ? `, ${s} skipped` : ''),
  exported: n => `${n} password(s) exported. The file holds them in the clear: don't open it in a spreadsheet (Excel), and delete it when you're done.`,
  keys: 'Passkeys are kept by Windows, not here: Windows Hello offers them when a site asks.',
  where: 'Passwords are kept in Windows Credential Manager, protected by your Windows account (as Chrome and Edge keep them): other users of this PC can\'t read them, but programs running as you can. Showing, copying and exporting ask Windows Hello first.',
};
const list = $('list'), none = $('none'), find = $('find'), error = $('error');
document.title = T.title;
$('title').textContent = T.title;
find.placeholder = T.find;
none.textContent = T.empty;
$('import').textContent = T.import;
$('export').textContent = T.export;
$('keys').textContent = T.keys;
$('where').textContent = T.where;
$('never-title').textContent = T.never;
let accounts = [];

function say(text) { error.textContent = text || ''; error.hidden = !text; }
// An answer that refused (Hello said no, or isn't set up) says why.
function heard(reply) { if (reply.error) say(reply.error); return reply; }

function row(a) {
  const name = a.user || T.noname;
  const secret = make('div', {className: 'secret', hidden: true});
  const words = make('div', {className: 'grow'}, [
    make('div', {className: 'host', textContent: a.host + (a.clear ? ' (http)' : '')}),
    make('div', {className: 'detail', textContent: name + (a.note ? ' — ' + a.note : '')}),
    secret,
  ]);
  const r = make('div', {className: 'row'}, [words]);
  r.dataset.host = a.host;
  r.dataset.user = a.user;
  const who = {host: a.host, user: a.user};
  const show = make('button', {className: 'act show', textContent: T.show, onclick: () => {
    if (!secret.hidden) { secret.hidden = true; secret.textContent = ''; show.textContent = T.show; return; }
    say('');
    ask('passwords.reveal', who).then(heard).then(reply => {
      if (reply.password === undefined) return;
      secret.textContent = reply.password; secret.hidden = false; show.textContent = T.hide;
      // Not left on screen.
      setTimeout(() => { secret.textContent = ''; secret.hidden = true; show.textContent = T.show; }, 30000);
    });
  }});
  const copy = make('button', {className: 'act copy', textContent: T.copy, onclick: () => {
    say('');
    ask('passwords.copy', who).then(heard).then(reply => { if (reply.copied) say(T.copied); });
  }});
  const edit = make('button', {className: 'act edit-it', textContent: T.edit, onclick: () => {
    const user = make('input', {type: 'text', value: a.user, placeholder: T.user});
    const note = make('input', {type: 'text', value: a.note || '', placeholder: T.note});
    const save = make('button', {textContent: T.save, onclick: () =>
      ask('passwords.save', Object.assign({new_user: user.value, note: note.value}, who)).then(heard).then(refresh)});
    const cancel = make('button', {textContent: T.cancel, onclick: refresh});
    r.append(make('div', {className: 'edit'}, [user, note, save, cancel]));
    edit.disabled = true;
  }});
  const remove = make('button', {className: 'act remove', textContent: T.remove, onclick: () => {
    if (confirm(T.sure(a.host + ' (' + name + ')'))) ask('passwords.delete', who).then(heard).then(refresh);
  }});
  r.append(show, copy, edit, remove);
  return r;
}

function draw() {
  const q = find.value.trim().toLowerCase();
  const shown = accounts.filter(a => !q || (a.host + ' ' + a.user + ' ' + (a.note || '')).toLowerCase().includes(q));
  const box = make('div', {className: 'box'});
  for (const a of shown) box.append(row(a));
  list.replaceChildren(...(shown.length ? [box] : []));
  none.hidden = !!shown.length;
}

function drawNever(sites) {
  $('never-title').hidden = !sites.length;
  const box = make('div', {className: 'box'});
  for (const site of sites) {
    box.append(make('div', {className: 'row'}, [make('div', {className: 'grow', textContent: site}),
      make('button', {className: 'act', textContent: T.forget, onclick: () => ask('passwords.forget_never', {site}).then(show)})]));
  }
  $('never').replaceChildren(...(sites.length ? [box] : []));
}

function show(reply) {
  heard(reply);
  accounts = reply.accounts || [];
  draw();
  drawNever(reply.never || []);
}
function refresh() { return ask('passwords.list').then(show); }
find.oninput = draw;
$('import').onclick = () => { say(''); ask('passwords.import').then(heard).then(r => { if (r.kept !== undefined) say(T.imported(r.kept, r.skipped)); refresh(); }); };
$('export').onclick = () => { say(''); ask('passwords.export').then(heard).then(r => { if (r.exported !== undefined) say(T.exported(r.exported)); }); };
refresh();
</script>
</body></html>
