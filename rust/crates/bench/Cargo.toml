[package]
name = "searchwin-bench"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "searchwin_bench"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]
